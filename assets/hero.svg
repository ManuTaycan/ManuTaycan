<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sergiu-Emanuel Trif, IT System Engineer</title>
  <desc id="desc">A dark technical banner showing a connected infrastructure diagram and areas of focus: cloud, infrastructure, automation and security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#08121e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#42d8d2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#37b9ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#37b9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa4bf" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="900" cy="210" rx="360" ry="260" fill="url(#glow)" filter="url(#soft)"/>

  <g opacity=".68" fill="none" stroke="#55c7de" stroke-width="1.4">
    <path d="M770 88L878 138L1018 104L1112 182L1042 302L899 326L792 259Z"/>
    <path d="M878 138L899 326M1018 104L1042 302M770 88L1042 302M792 259L1112 182" stroke-opacity=".4"/>
  </g>
  <g fill="#0b1728" stroke="#69d7df" stroke-width="2">
    <circle cx="770" cy="88" r="8"/>
    <circle cx="878" cy="138" r="8"/>
    <circle cx="1018" cy="104" r="8"/>
    <circle cx="1112" cy="182" r="8"/>
    <circle cx="1042" cy="302" r="8"/>
    <circle cx="899" cy="326" r="8"/>
    <circle cx="792" cy="259" r="8"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(74 70)">
      <rect x="0" y="0" width="62" height="7" rx="3.5" fill="url(#accent)"/>
      <text x="0" y="68" fill="#f3f8ff" font-size="43" font-weight="700" letter-spacing="-.6">Sergiu-Emanuel Trif</text>
      <text x="0" y="113" fill="#91a7be" font-size="20" letter-spacing="2.4">IT SYSTEM ENGINEER</text>
      <text x="0" y="165" fill="#c9d7e7" font-size="19">Microsoft infrastructure · Hybrid systems · Automation · Security</text>

      <g transform="translate(0 218)">
        <rect width="166" height="42" rx="21" fill="#10263e" stroke="#2f5274"/>
        <circle cx="24" cy="21" r="5" fill="#58d4cf"/>
        <text x="41" y="27" fill="#dbe8f5" font-size="15">INFRASTRUCTURE</text>
      </g>
      <g transform="translate(178 218)">
        <rect width="116" height="42" rx="21" fill="#10263e" stroke="#2f5274"/>
        <circle cx="24" cy="21" r="5" fill="#6d9cff"/>
        <text x="41" y="27" fill="#dbe8f5" font-size="15">CLOUD</text>
      </g>
      <g transform="translate(306 218)">
        <rect width="152" height="42" rx="21" fill="#10263e" stroke="#2f5274"/>
        <circle cx="24" cy="21" r="5" fill="#58d4cf"/>
        <text x="41" y="27" fill="#dbe8f5" font-size="15">AUTOMATION</text>
      </g>
    </g>

    <g transform="translate(870 177)">
      <rect width="174" height="88" rx="18" fill="#0d1f33" stroke="#31597a"/>
      <path d="M28 31h32M28 44h22M28 57h36" stroke="#65d5d2" stroke-width="3" stroke-linecap="round"/>
      <text x="81" y="39" fill="#e3edf7" font-size="14" font-weight="600">RELIABLE</text>
      <text x="81" y="59" fill="#88a2bb" font-size="12">BY DESIGN</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#9ab8d3" stroke-opacity=".16" stroke-width="2"/>
</svg>

